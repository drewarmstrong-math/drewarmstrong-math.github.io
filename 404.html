<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Page not found — Drew Armstrong</title>
<link rel="stylesheet" href="/UM_style.css">
<script src="/menu.js" defer></script>
<style>
  .not-found-image {
    display: block;
    width: 50%;
    margin-top: 30px;
  }
</style>
<script>
  const legacyPath = window.location.pathname;
  if (/\.php$/i.test(legacyPath)) {
    window.location.replace(
      legacyPath.replace(/\.php$/i, ".html") +
      window.location.search +
      window.location.hash
    );
  }
</script>
</head>
<body>
<div id="main">
  <div id="head"><a href="/index.html"><h1>Drew Armstrong</h1></a></div>
  <site-menu></site-menu>
  <div id="content">
    <h1>File not found.</h1>
    <img class="not-found-image" src="/confused-travolta.gif" alt="John Travolta looking confused">
  </div>
</div>
</body>
</html>
